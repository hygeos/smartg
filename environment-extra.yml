# To create an environment from this file, run the following command:
# $ conda env create -p /path/to/env/env-name -f "environment-extra.yml"
#
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.15
  - numpy>=2,<3
  - xarray
  - pandas
  - scipy
  - h5py
  - openpyxl
  - pytest
  - pytest-xdist
  - pytest-html
  - progressbar2
  - tqdm
  - matplotlib
  - papermill
  - python-dotenv
  - notebook
  - jupytext>=1.16,<2
  - ipywidgets
  - ipympl
  - geoclide>=4.0.0,<5
  - luts
  - pytrunc>=2.1.0,<3
  - gatiab>=1.1.2,<2
  - pip
  - pip:
    - pycuda
    - jax[cuda12]>=0.4
    - radis>=0.17
    - hitran-api>=1.1
