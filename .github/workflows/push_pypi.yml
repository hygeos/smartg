# Publish to PyPI when a version tag (e.g. v1.0.3) is pushed, provided the
# tagged commit is on the main (or master) branch.
#
# Prerequisites (one-time, per repository):
#   - Create the "pypi" environment in the repo Settings > Environments.
#   - Configure a Trusted Publisher on pypi.org for the project
#     (PyPI project Settings > Publishing > Add a new publisher) with:
#     owner = <org/user>, repo = <repo>, workflow = push_pypi.yml, environment = pypi
#
# Assumes the project name and version are declared statically under [project]
# in pyproject.toml (the PyPI project name may differ from the repository name).

name: Publish to PyPI

# The tag filter uses + (one or more digits) so that pre-release tags such as
# v1.0.0dev1 or v1.0.0rc1 do not trigger a publish.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    outputs:
      package-name: ${{ steps.metadata.outputs.name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + all branches, needed for the ancestry check

      # A tag push event does not know which branch the commit came from, so
      # check that the tagged commit is an ancestor of main (or master).
      # GITHUB_SHA is peeled with ^{commit} because for annotated tags it
      # points to the tag object, not the commit.
      - name: Verify tag is on main or master
        run: |
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if git merge-base --is-ancestor "$commit" origin/main 2>/dev/null || \
             git merge-base --is-ancestor "$commit" origin/master 2>/dev/null; then
            echo "Tag $GITHUB_REF_NAME is on the default branch. Proceeding."
          else
            echo "::error::Tag $GITHUB_REF_NAME is not on main/master. Aborting."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        id: metadata
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_name=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=$pkg_name" >> "$GITHUB_OUTPUT"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag version ($tag_version) does not match pyproject.toml version ($pkg_version)."
            exit 1
          fi

      - name: Build package (sdist + wheel)
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The "pypi" environment enables Trusted Publishing (OIDC): no API token
    # to store in the repo. id-token: write lets GitHub mint the OIDC token
    # that PyPI validates.
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package-name }}
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
