name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

# The version tags are pushed to hygeos/smartg_pv too, which is not the
# Trusted Publisher of the PyPI project: publish from hygeos/smartg only
jobs:
  build:
    if: github.repository == 'hygeos/smartg'
    uses: hygeos/reusable-workflows/.github/workflows/pypi_build.yml@v1

  publish:
    if: github.repository == 'hygeos/smartg'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.package-name }}
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
