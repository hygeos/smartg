[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]

[project]
name = "smartg"
version = "2.0.2"
description = """
SMART-G (Speed-up Monte Carlo Advanced Radiative Transfer Code using GPU) is a radiative \
transfer code using a Monte-Carlo technique to simulate the propagation of the polarized \
light in the atmosphere and/or ocean, and using GPU acceleration."""
authors = [
    {name = "Mustapha Moulana", email = "mm@hygeos.com"},
    {name = "Didier Ramon", email = "dr@hygeos.com"},
    {name = "François Steinmetz", email = "fs@hygeos.com"},
    {name = "Dominique Jolivet", email = "dj@hygeos.com"},
    {name = "Mathieu Compiègne", email = "mc@hygeos.com"}
]
readme = "README.md"
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'License :: Free for non-commercial use',
    'License :: Other/Proprietary License',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Scientific/Engineering'
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2,<3",
    "xarray",
    "pandas",
    "scipy",
    "h5py",
    # openpyxl backs the pandas.read_excel of the Sentinel-2 spectral
    # responses in demo_notebook.py
    "openpyxl",
    "progressbar2",
    "tqdm",
    "matplotlib",
    "python-dotenv",
    "notebook",
    "jupytext>=1.16,<2",
    "ipywidgets",
    # ipympl backs the "%matplotlib widget" backend of the notebooks
    "ipympl",
    "pycuda",
    "geoclide>=4.0.0,<5",
    "luts",
    "pytrunc>=2.1.0,<3",
    "gatiab>=1.1.2,<2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-html",
    "papermill"
]
extra = [
    "jax[cuda12]>=0.4",
    "radis>=0.17",
    "hitran-api>=1.1"
]


[project.urls]
Source = "https://github.com/hygeos/smartg"

[tool.setuptools]
# The CUDA sources, the demo notebooks and the tests ship as package
# data (see MANIFEST.in); setuptools only keeps the data of the listed
# packages, so their folders are listed too
packages = [
    "smartg",
    "smartg.iprt",
    "smartg.notebooks",
    "smartg.src",
    "smartg.src.incRNGs.Random123",
    "smartg.src.incRNGs.Random123.conventional",
    "smartg.src.incRNGs.Random123.features",
    "smartg.tests",
    "smartg.tests.logs",
]

# **** pixi configuration ****
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
smartg = { path = ".", editable = true }

[tool.pixi.dependencies]
luts = "*"

[tool.pixi.environments]
# pixi shell # default environment
# pixi shell --environment extra # environment with extra dependencies
default = { features = ["test"], solve-group = "default" }
extra = { features = ["test", "extra"], solve-group = "extra" }

[tool.pixi.tasks]
# pixi run test-basic
test-basic = """
pytest smartg/tests/test_cuda.py smartg/tests/test_profile.py \
smartg/tests/test_atm3d.py smartg/tests/test_smartg.py -s -v"""
test-all = "pytest smartg/tests/ -s -v"
# pixi run sync-notebooks # create or update the paired .ipynb notebooks
sync-notebooks = "jupytext --sync smartg/notebooks/*.py"

# **** jupytext configuration ****
[tool.jupytext]
# The notebooks are tracked as percent scripts (.py), paired with local
# .ipynb notebooks that keep the outputs and are ignored by git. Only
# the cell tags are kept in the scripts, not the editor metadata.
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
cell_metadata_filter = "tags,-all"

[tool.pyright]
# Suppress "partially unknown" errors from third-party libraries with incomplete stubs (e.g. xarray)
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
# Suppress call-issue errors caused by incomplete stubs (e.g. missing parameters in xarray stubs)
reportCallIssue = "none"
# smartg/obselete_files holds unused Python 2 modules (see its README)
exclude = ["**/__pycache__", "**/node_modules", ".pixi",
           "smartg/obselete_files"]

[tool.ruff]
line-length = 79
# smartg/obselete_files holds unused Python 2 modules that no longer
# parse (see its README); nothing imports them and they are not packaged.
# force-exclude applies it to paths passed on the command line too, so
# that `ruff check $(git ls-files '*.py')` skips them as well
extend-exclude = ["smartg/obselete_files"]
force-exclude = true

[tool.ruff.lint]
# PEP 8 and the docstring and annotation rules on top of the default
# ones of the pinned ruff, for the whole package. The whitespace rules
# E1, E2 and E3 of PEP 8 are still preview rules, hence their explicit
# codes.
preview = true
explicit-preview-rules = true
extend-select = [
    "E111", "E112", "E113", "E114", "E115", "E116", "E117",
    "E201", "E202", "E203", "E204", "E211", "E221", "E222", "E223",
    "E224", "E225", "E226", "E227", "E228", "E231", "E241", "E242",
    "E251", "E252", "E261", "E262", "E265", "E266", "E271", "E272",
    "E273", "E274", "E275", "E301", "E302", "E303", "E304", "E305",
    "E306", "E4", "E501", "E7", "W", "N", "D", "ANN", "I",
]
# Any is the right annotation of **kwargs passed through
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The notebooks are percent scripts: their markdown cells are
# comment blocks, whose table rows cannot wrap, an import may open
# any cell, as ruff allows in .ipynb files, and a script opening on
# a markdown cell has no module docstring
"smartg/notebooks/*.py" = [
    "D100", "E402", "E501", "W505",
]
# test_smartg_jax sets JAX_PLATFORMS in the environment before it
# imports jax, so that jax does not open a CUDA context of its own and
# collide with the pycuda one when the process exits
"smartg/tests/test_smartg_jax.py" = ["E402"]

[tool.ruff.lint.pycodestyle]
# Comments and docstrings (W505)
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "numpy"
